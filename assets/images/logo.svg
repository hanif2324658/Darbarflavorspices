<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="460" height="90">
  <defs>
    <!-- Royal Metallic Gold Gradients -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="55%" stop-color="#AA8022" />
      <stop offset="85%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#8C6615" />
    </linearGradient>

    <linearGradient id="goldGleam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF2B8" />
      <stop offset="100%" stop-color="#AA8022" />
    </linearGradient>

    <linearGradient id="spiceRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E74C3C" />
      <stop offset="100%" stop-color="#8B0000" />
    </linearGradient>

    <filter id="royalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Ornate Royal Crest / Shield on the Left -->
  <g transform="translate(10, 6)" filter="url(#royalShadow)">
    <!-- Ornate Mughal Arch / Royal Shield -->
    <path d="M38 4 C50 4 68 12 72 24 C76 42 66 64 38 78 C10 64 0 42 4 24 C8 12 26 4 38 4 Z" 
          fill="#111111" stroke="url(#goldSheen)" stroke-width="2.5" />

    <!-- Inner gold border -->
    <path d="M38 10 C47 10 62 16 65 26 C68 40 60 58 38 70 C16 58 8 40 11 26 C14 16 29 10 38 10 Z" 
          fill="#181818" stroke="url(#goldSheen)" stroke-width="1" stroke-dasharray="3,2" opacity="0.8" />

    <!-- Royal Crown Topper -->
    <path d="M26 12 L31 18 L38 10 L45 18 L50 12 L48 20 L28 20 Z" fill="url(#goldSheen)" />

    <!-- Center Spice Icon: Star Anise & Saffron Motif -->
    <g transform="translate(38, 44) scale(0.9)">
      <!-- 8-petal spice star flower -->
      <path d="M0 -22 C3 -13 6 -8 15 -15 C8 -6 13 3 22 0 C13 6 8 13 15 22 C6 15 -3 13 0 22 C-3 13 -8 6 -17 11 C-10 4 -15 -5 -22 0 C-13 -3 -8 -8 -11 -17 C-4 -10 -2 -14 0 -22 Z" 
            fill="url(#goldSheen)" />
      <!-- Center Crimson Spice Pearl -->
      <circle cx="0" cy="0" r="5" fill="url(#spiceRedGrad)" stroke="#FFE8A3" stroke-width="1.2" />
    </g>

    <!-- Bottom decorative scroll -->
    <path d="M24 72 Q38 80 52 72" stroke="url(#goldSheen)" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- Typography Group -->
  <g transform="translate(95, 0)">
    <!-- Brand Name: DARBAR -->
    <text x="0" y="38" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif" font-size="31" font-weight="800" letter-spacing="4" fill="url(#goldSheen)" filter="url(#royalShadow)">DARBAR</text>
    
    <!-- Urdu Calligraphy: دربار فلیورز مصالحہ جات -->
    <text x="350" y="36" text-anchor="end" font-family="'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', serif" font-size="22" font-weight="700" fill="#F8E5A7" filter="url(#royalShadow)">دربار فلیورز مصالحہ جات</text>

    <!-- Subtitle: FLAVORS & SPICES -->
    <text x="3" y="58" font-family="'Outfit', 'Poppins', sans-serif" font-size="12" font-weight="700" letter-spacing="4.5" fill="#FFFFFF">FLAVORS &amp; SPICES</text>

    <!-- Royal Ornate Divider Bar -->
    <line x1="2" y1="68" x2="350" y2="68" stroke="url(#goldGleam)" stroke-width="1.2" />
    <!-- Center Accent Gem on Divider -->
    <polygon points="175,64 179,68 175,72 171,68" fill="url(#spiceRedGrad)" stroke="#F8E5A7" stroke-width="0.8" />

    <!-- Tagline: 100% PURE & TRADITIONAL SEASONINGS -->
    <text x="3" y="80" font-family="'Outfit', sans-serif" font-size="9" font-weight="600" letter-spacing="2.5" fill="#D1C7B7">100% PURE • STONE-GROUND • AUTHENTIC</text>
  </g>
</svg>
